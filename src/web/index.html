<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EVAI Evertalk — Persona Web Chat Preview</title>
  <style>
    /* ==========================================================================
       EVAI Evertalk Design System (Pure CSS - Zero External CDN / Framework)
       ========================================================================== */
    :root {
      --bg-base: #0a0c10;
      --bg-surface: #12161f;
      --bg-card: #1a202c;
      --bg-card-hover: #222938;
      --bg-bubble-bot: #1c2433;
      --bg-bubble-user: linear-gradient(135deg, #ff2e78 0%, #8b1fe6 100%);
      --bg-accent-soft: rgba(255, 46, 120, 0.12);
      
      --border-subtle: #242c3d;
      --border-accent: rgba(255, 46, 120, 0.4);
      --border-focus: #ff2e78;
      
      --accent-garnet: #ff2e78;
      --accent-garnet-glow: rgba(255, 46, 120, 0.35);
      --accent-purple: #9d4edd;
      --accent-cyan: #00f0ff;
      --accent-emerald: #10b981;
      --accent-amber: #f59e0b;
      
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --text-inverse: #ffffff;
      
      --font-sans: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --radius-full: 9999px;
      
      --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
      --shadow-glow: 0 0 20px var(--accent-garnet-glow);
      --transition-fast: 0.18s ease;
      --transition-normal: 0.25s ease;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.5;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-subtle);
      border-radius: var(--radius-full);
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }

    /* App Shell Container */
    .app-container {
      display: grid;
      grid-template-columns: 320px 1fr 360px;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at 50% 0%, #171b26 0%, var(--bg-base) 70%);
    }

    /* ==========================================================================
       Column 1: Persona Directory Sidebar
       ========================================================================== */
    .sidebar-personas {
      display: flex;
      flex-direction: column;
      background-color: var(--bg-surface);
      border-right: 1px solid var(--border-subtle);
      height: 100%;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: linear-gradient(180deg, rgba(255, 46, 120, 0.05) 0%, transparent 100%);
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.3px;
    }

    .brand-title svg {
      color: var(--accent-garnet);
      filter: drop-shadow(0 0 8px var(--accent-garnet-glow));
    }

    .persona-count-badge {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      padding: 2px 8px;
      border-radius: var(--radius-full);
      font-size: 11px;
      font-weight: 600;
      color: var(--accent-garnet);
    }

    .search-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-box svg {
      position: absolute;
      left: 12px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 8px 12px 8px 36px;
      color: var(--text-primary);
      font-size: 13px;
      outline: none;
      transition: border-color var(--transition-fast);
    }

    .search-input:focus {
      border-color: var(--accent-garnet);
      box-shadow: 0 0 0 2px var(--bg-accent-soft);
    }

    .filter-tabs {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .filter-tab {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-secondary);
      font-size: 12px;
      padding: 4px 10px;
      border-radius: var(--radius-full);
      cursor: pointer;
      white-space: nowrap;
      transition: all var(--transition-fast);
    }

    .filter-tab:hover {
      color: var(--text-primary);
      background: var(--bg-card);
    }

    .filter-tab.active {
      color: var(--accent-garnet);
      background: var(--bg-accent-soft);
      border-color: var(--border-accent);
      font-weight: 600;
    }

    .persona-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .persona-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: var(--radius-md);
      background: transparent;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all var(--transition-fast);
      text-align: left;
    }

    .persona-card:hover {
      background: var(--bg-card);
      border-color: var(--border-subtle);
    }

    .persona-card.active {
      background: var(--bg-card);
      border-color: var(--accent-garnet);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4), 0 0 12px var(--bg-accent-soft);
    }

    .avatar-wrapper {
      position: relative;
      width: 44px;
      height: 44px;
      border-radius: var(--radius-full);
      background: linear-gradient(135deg, #2d3748, #1a202c);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      border: 2px solid var(--border-subtle);
      flex-shrink: 0;
      overflow: hidden;
    }

    .persona-card.active .avatar-wrapper {
      border-color: var(--accent-garnet);
    }

    .status-dot {
      position: absolute;
      bottom: 1px;
      right: 1px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent-emerald);
      border: 2px solid var(--bg-surface);
    }

    .persona-card-content {
      flex: 1;
      min-width: 0;
    }

    .persona-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2px;
    }

    .persona-card-name {
      font-weight: 600;
      font-size: 14px;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .persona-badge-race {
      font-size: 10px;
      padding: 1px 6px;
      border-radius: var(--radius-sm);
      background: var(--bg-base);
      color: var(--text-secondary);
      border: 1px solid var(--border-subtle);
      flex-shrink: 0;
    }

    .persona-card-title {
      font-size: 12px;
      color: var(--accent-garnet);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }

    .persona-card-preview {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ==========================================================================
       Column 2: Evertalk Messenger View (Center Chat)
       ========================================================================== */
    .chat-view {
      display: flex;
      flex-direction: column;
      height: 100%;
      position: relative;
      background: radial-gradient(circle at 50% 10%, rgba(157, 78, 221, 0.04) 0%, transparent 60%);
    }

    .chat-header {
      padding: 14px 20px;
      background: rgba(18, 22, 31, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }

    .chat-header-persona {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .chat-header-info h2 {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chat-header-info p {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .chat-header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .action-button {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .action-button:hover {
      background: var(--bg-card-hover);
      color: var(--text-primary);
      border-color: var(--border-accent);
    }

    .action-button.primary {
      background: var(--accent-garnet);
      color: var(--text-inverse);
      border-color: transparent;
      box-shadow: 0 0 12px var(--accent-garnet-glow);
    }

    .action-button.primary:hover {
      background: #ff1465;
    }

    .action-button svg {
      width: 14px;
      height: 14px;
    }

    /* Chat Messages Flow */
    .chat-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .chat-session-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 12px 0;
      color: var(--text-muted);
      font-size: 11px;
    }

    .chat-session-divider::before,
    .chat-session-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border-subtle);
    }

    .message-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      max-width: 82%;
      animation: fadeInSlide 0.22s ease forwards;
    }

    @keyframes fadeInSlide {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message-row.persona {
      align-self: flex-start;
    }

    .message-row.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .message-avatar {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-full);
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-primary);
      flex-shrink: 0;
    }

    .message-row.user .message-avatar {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-color: #60a5fa;
    }

    .message-content-wrap {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .message-row.user .message-content-wrap {
      align-items: flex-end;
    }

    .message-sender-name {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-left: 2px;
    }

    .message-bubble-wrapper {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    .message-row.user .message-bubble-wrapper {
      flex-direction: row-reverse;
    }

    .message-bubble {
      padding: 11px 15px;
      border-radius: var(--radius-lg);
      font-size: 14px;
      line-height: 1.55;
      word-break: break-word;
      white-space: pre-wrap;
      position: relative;
      box-shadow: var(--shadow-sm);
    }

    .message-row.persona .message-bubble {
      background: var(--bg-bubble-bot);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      border-top-left-radius: var(--radius-sm);
    }

    .message-row.user .message-bubble {
      background: var(--bg-bubble-user);
      color: var(--text-inverse);
      border-top-right-radius: var(--radius-sm);
    }

    .message-time {
      font-size: 10px;
      color: var(--text-muted);
      white-space: nowrap;
      margin-bottom: 2px;
    }

    /* Typing Indicator */
    .typing-indicator {
      display: none;
      align-items: center;
      gap: 4px;
      padding: 10px 14px;
      background: var(--bg-bubble-bot);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      border-top-left-radius: var(--radius-sm);
      width: fit-content;
      margin-left: 48px;
    }

    .typing-dot {
      width: 6px;
      height: 6px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: typingBounce 1.4s infinite ease-in-out both;
    }

    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }
    .typing-dot:nth-child(3) { animation-delay: 0s; }

    @keyframes typingBounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; background: var(--accent-garnet); }
    }

    /* Chat Footer & Input Controls */
    .chat-footer {
      padding: 12px 20px 16px;
      background: rgba(18, 22, 31, 0.95);
      border-top: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Speech Pattern Suggestion Chips */
    .speech-chips-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .speech-chip-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent-garnet);
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 4px;
      margin-right: 4px;
    }

    .speech-chip {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      font-size: 12px;
      padding: 5px 12px;
      border-radius: var(--radius-full);
      white-space: nowrap;
      cursor: pointer;
      transition: all var(--transition-fast);
      flex-shrink: 0;
    }

    .speech-chip:hover {
      color: var(--text-primary);
      border-color: var(--accent-garnet);
      background: var(--bg-accent-soft);
    }

    .input-form-container {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 8px 12px;
      transition: border-color var(--transition-fast);
    }

    .input-form-container:focus-within {
      border-color: var(--accent-garnet);
      box-shadow: 0 0 0 2px var(--bg-accent-soft);
    }

    .chat-textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 14px;
      line-height: 1.4;
      resize: none;
      max-height: 120px;
      min-height: 24px;
    }

    .chat-textarea::placeholder {
      color: var(--text-muted);
    }

    .send-btn {
      background: var(--accent-garnet);
      color: var(--text-inverse);
      border: none;
      width: 34px;
      height: 34px;
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all var(--transition-fast);
      box-shadow: 0 2px 6px var(--accent-garnet-glow);
    }

    .send-btn:hover {
      background: #ff1465;
      transform: scale(1.05);
    }

    .send-btn:disabled {
      background: var(--border-subtle);
      color: var(--text-muted);
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .send-btn svg {
      width: 16px;
      height: 16px;
    }

    /* ==========================================================================
       Column 3: Persona Inspector & Evertalk Log Panel
       ========================================================================== */
    .sidebar-inspector {
      display: flex;
      flex-direction: column;
      background-color: var(--bg-surface);
      border-left: 1px solid var(--border-subtle);
      height: 100%;
      overflow: hidden;
      transition: transform var(--transition-normal);
    }

    .inspector-nav {
      display: flex;
      border-bottom: 1px solid var(--border-subtle);
      background: var(--bg-card);
    }

    .inspector-nav-tab {
      flex: 1;
      padding: 12px 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      text-align: center;
      transition: all var(--transition-fast);
    }

    .inspector-nav-tab:hover {
      color: var(--text-primary);
    }

    .inspector-nav-tab.active {
      color: var(--accent-garnet);
      border-bottom-color: var(--accent-garnet);
    }

    .inspector-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Profile Tab Details */
    .profile-hero-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .profile-hero-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: linear-gradient(135deg, rgba(255, 46, 120, 0.2), rgba(157, 78, 221, 0.2));
    }

    .hero-avatar {
      width: 72px;
      height: 72px;
      border-radius: var(--radius-full);
      background: var(--bg-base);
      border: 3px solid var(--accent-garnet);
      box-shadow: 0 0 16px var(--accent-garnet-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 800;
      color: var(--text-primary);
      margin-top: 16px;
      margin-bottom: 8px;
      position: relative;
      z-index: 1;
    }

    .hero-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .hero-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--accent-garnet);
      margin-top: 2px;
    }

    .hero-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 10px;
    }

    .hero-tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: var(--radius-sm);
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
    }

    .section-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .section-title svg {
      color: var(--accent-garnet);
    }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .detail-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .detail-label {
      font-size: 11px;
      color: var(--text-muted);
    }

    .detail-value {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .tags-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .badge-like {
      background: rgba(255, 46, 120, 0.15);
      border: 1px solid rgba(255, 46, 120, 0.3);
      color: #ff6b9d;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: var(--radius-full);
    }

    .badge-dislike {
      background: rgba(100, 116, 139, 0.15);
      border: 1px solid rgba(100, 116, 139, 0.3);
      color: #cbd5e1;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: var(--radius-full);
    }

    .personality-text {
      font-size: 12px;
      line-height: 1.6;
      color: var(--text-secondary);
      white-space: pre-wrap;
    }

    .comment-item {
      padding: 8px 10px;
      background: var(--bg-surface);
      border-radius: var(--radius-sm);
      border-left: 3px solid var(--accent-purple);
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .comment-writer {
      font-weight: 700;
      color: var(--accent-purple);
      font-size: 11px;
    }

    .comment-body {
      color: var(--text-primary);
      line-height: 1.4;
    }

    /* Evertalk Log Explorer Tab */
    .evertalk-logs-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .log-playback-controls {
      display: flex;

          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");

            const data = await res.json();
            state.isServerConnected = true;
            els.offlineBanner.style.display = "none";
            return true;
          }
        } catch (_) {
          // Server offline
        }
        state.isServerConnected = false;
        els.offlineBanner.style.display = "block";
        return false;
      }

      async function fetchPersonas() {
        if (!state.isServerConnected) {
          // Use seed fallback list
          state.personas = [
            {
              id: "garnet_rapture",
              name: "가넷(열락)",
              name_en: "Garnet (Rapture)",
              grade: "에픽",
              race: "불사형",
              class: "서포터",
              nick_name: "위험한 초대",
              greeting: "구원자님의 사랑스러운 토끼, 가넷 등장!",
              speech_patterns_count: 7,
              evertalk_count: 5
            }
          ];
          applyPersonaFilters();
          return;
        }

        try {
          const res = await fetch("/api/personas");
          if (res.ok) {
            const data = await res.json();
            state.personas = data.personas || [];
            applyPersonaFilters();
          }
        } catch (err) {
          console.error("Failed to load personas:", err);
        }
      }

      async function fetchPersonaDetail(personaId) {
        if (!state.isServerConnected) {
          state.currentPersonaData = FALLBACK_PERSONA_GARNET;
          renderActivePersona();
          return;
        }

        try {
          const res = await fetch(`/api/persona?id=${encodeURIComponent(personaId)}`);
          if (res.ok) {
            const data = await res.json();
            state.currentPersonaData = data;
            renderActivePersona();
          }
        } catch (err) {
          console.error(`Failed to load persona ${personaId}:`, err);
        }
      }

      async function sendChatApi(personaId, message) {
        if (!state.isServerConnected) {
          // Simulated local response from current speech patterns
          const p = state.currentPersonaData;
          let reply = "…구원자님과 함께라서 기뻐요.";
          if (p.speech_patterns && p.speech_patterns.length > 0) {
            const randIdx = Math.floor(Math.random() * p.speech_patterns.length);
            reply = p.speech_patterns[randIdx];
          } else if (p.personality && p.personality.greeting) {
            reply = p.personality.greeting;
          }
          return { reply };
        }

        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            persona_id: personaId,
            message: message,
            history: state.chatHistory.slice(-10)
          })
        });

        if (!res.ok) {
          throw new Error(`Chat API error: ${res.status}`);
        }
        return await res.json();
      }

      // ------------------------------------------------------------------------
      // Filtering & List Rendering
      // ------------------------------------------------------------------------
      function applyPersonaFilters() {
        const query = state.searchQuery.toLowerCase().trim();
        const race = state.currentRaceFilter;

        state.filteredPersonas = state.personas.filter(p => {
          const matchRace = (race === "all" || p.race === race);
          const matchQuery = (!query ||
            (p.name && p.name.toLowerCase().includes(query)) ||
            (p.name_en && p.name_en.toLowerCase().includes(query)) ||
            (p.nick_name && p.nick_name.toLowerCase().includes(query))
          );
          return matchRace && matchQuery;
        });

        els.personaCountBadge.textContent = `${state.filteredPersonas.length}명`;
        renderPersonaList();
      }

      function renderPersonaList() {
        els.personaListContainer.innerHTML = "";

        if (state.filteredPersonas.length === 0) {
          const emptyDiv = document.createElement("div");
          emptyDiv.style.padding = "24px 16px";
          emptyDiv.style.textAlign = "center";
          emptyDiv.style.color = "var(--text-muted)";
          emptyDiv.textContent = "조건에 일치하는 페르소나가 없습니다.";
          els.personaListContainer.appendChild(emptyDiv);
          return;
        }

        state.filteredPersonas.forEach(p => {
          const card = document.createElement("button");
          card.type = "button";
          card.className = "persona-card" + (p.id === state.selectedPersonaId ? " active" : "");
          card.dataset.id = p.id;

          const initial = getInitial(p.name);
          const title = p.nick_name || p.name_en || "";
          const preview = p.greeting || `에버톡 대화 ${p.evertalk_count || 0}건`;

          card.innerHTML = `
            <div class="avatar-wrapper">
              ${escapeHtml(initial)}
              <span class="status-dot"></span>
            </div>
            <div class="persona-card-content">
              <div class="persona-card-header">
                <span class="persona-card-name">${escapeHtml(p.name)}</span>
                <span class="persona-badge-race">${escapeHtml(p.race || "미상")}</span>
              </div>
              <div class="persona-card-title">${escapeHtml(title)}</div>
              <div class="persona-card-preview">${escapeHtml(preview)}</div>
            </div>
          `;

          card.addEventListener("click", () => {
            selectPersona(p.id);
          });

          els.personaListContainer.appendChild(card);
        });
      }

      function selectPersona(personaId) {
        if (state.selectedPersonaId === personaId && state.currentPersonaData) return;
        state.selectedPersonaId = personaId;

        // Update active class in list
        document.querySelectorAll(".persona-card").forEach(el => {
          el.classList.toggle("active", el.dataset.id === personaId);
        });

        // Clear playback timer if active
        if (state.playbackTimer) {
          clearInterval(state.playbackTimer);
          state.playbackTimer = null;
        }

        fetchPersonaDetail(personaId);
      }

      // ------------------------------------------------------------------------
      // Active Persona Presentation (Header, Inspector, Chips)
      // ------------------------------------------------------------------------
      function renderActivePersona() {
        const p = state.currentPersonaData;
        if (!p) return;

        const initial = getInitial(p.name);
        const nick = p.profile?.nick_name || p.name_en || "";
        const cv = p.profile?.cv_ko || p.profile?.cv_jp || "미상";

        // 1. Center Header
        els.headerAvatar.textContent = initial;
        els.headerPersonaName.querySelector("span:first-child").textContent = p.name;
        els.headerPersonaRace.textContent = p.race || "불사형";
        els.headerPersonaSubtitle.textContent = `${nick ? nick + " · " : ""}CV. ${cv}`;

        // 2. Speech Pattern Suggestion Chips
        renderSpeechChips(p.speech_patterns || []);

        // 3. Right Inspector Profile Hero
        els.heroAvatar.textContent = initial;
        els.heroName.textContent = p.name;
        els.heroTitle.textContent = nick;

        els.heroTags.innerHTML = "";
        const tags = [p.grade, p.race, p.class, p.sub_class, p.stat].filter(Boolean);
        tags.forEach(t => {
          const span = document.createElement("span");
          span.className = "hero-tag";
          span.textContent = t;
          els.heroTags.appendChild(span);
        });

        // Specs
        els.detailBirthday.textContent = formatBirthday(p.profile?.birthday);
        els.detailUnion.textContent = p.profile?.union || "무소속";
        const h = p.profile?.height ? `${p.profile.height}cm` : "-";
        const w = p.profile?.weight ? `${p.profile.weight}kg` : "-";
        els.detailBody.textContent = `${h} / ${w}`;
        els.detailCv.textContent = cv;

        // Likes / Dislikes
        renderTags(els.likesTagList, p.profile?.like, "badge-like");
        renderTags(els.dislikesTagList, p.profile?.dislike, "badge-dislike");

        // Personality Description
        els.personalityDescriptionText.textContent = p.personality?.description || p.personality?.greeting || "기록된 성격 정보가 없습니다.";

        // Comments
        renderComments(p.comments || []);

        // 4. Inspector Evertalk Logs Tab
        renderEvertalkLogTab(p.dialogues?.evertalk || []);

        // Reset chat window with greeting
        resetChatWithGreeting(p);
      }

      function renderTags(container, list, badgeClass) {
        container.innerHTML = "";
        if (!list || list.length === 0) {
          const span = document.createElement("span");
          span.style.fontSize = "11px";
          span.style.color = "var(--text-muted)";
          span.textContent = "없음";
          container.appendChild(span);
          return;
        }
        list.forEach(item => {
          const badge = document.createElement("span");
          badge.className = badgeClass;
          badge.textContent = item;
          container.appendChild(badge);
        });
      }

      function renderComments(comments) {
        els.commentsContainer.innerHTML = "";
        if (comments.length === 0) {
          const empty = document.createElement("div");
          empty.style.fontSize = "11px";
          empty.style.color = "var(--text-muted)";
          empty.textContent = "등록된 코멘트가 없습니다.";
          els.commentsContainer.appendChild(empty);
          return;
        }

        comments.forEach(c => {
          const item = document.createElement("div");
          item.className = "comment-item";
          item.innerHTML = `
            <span class="comment-writer">${escapeHtml(c.writer)}</span>
            <span class="comment-body">${escapeHtml(c.comment)}</span>
          `;
          els.commentsContainer.appendChild(item);
        });
      }

      function renderSpeechChips(patterns) {
        // Keep the label element
        const label = els.speechChipsContainer.firstElementChild;
        els.speechChipsContainer.innerHTML = "";
        els.speechChipsContainer.appendChild(label);

        if (!patterns || patterns.length === 0) return;

        patterns.slice(0, 8).forEach(pat => {
          const chip = document.createElement("button");
          chip.type = "button";
          chip.className = "speech-chip";
          chip.textContent = pat.length > 22 ? pat.slice(0, 22) + "…" : pat;
          chip.title = pat;

          chip.addEventListener("click", () => {
            els.chatInputText.value = pat;
            els.chatInputText.focus();
          });

          els.speechChipsContainer.appendChild(chip);
        });
      }

      function renderEvertalkLogTab(turns) {
        els.logSummaryLabel.textContent = `총 ${turns.length}개 턴`;
        els.evertalkLogList.innerHTML = "";

        if (!turns || turns.length === 0) {
          const empty = document.createElement("div");
          empty.style.padding = "20px";
          empty.style.textAlign = "center";
          empty.style.color = "var(--text-muted)";
          empty.style.fontSize = "12px";
          empty.textContent = "기록된 에버톡 대화가 없습니다.";
          els.evertalkLogList.appendChild(empty);
          return;
        }

        turns.forEach((turn, idx) => {
          const card = document.createElement("div");
          card.className = "log-entry-card";

          const isSavior = ["구원자", "Savior", "savior"].includes(turn.speaker);
          const isCurrentPersona = turn.speaker === state.currentPersonaData.name;
          const speakerClass = isSavior ? "savior" : (isCurrentPersona ? "persona" : "other");

          card.innerHTML = `
            <div class="log-speaker-row">
              <span class="log-speaker ${speakerClass}">${escapeHtml(turn.speaker)}</span>
              <span class="log-index">#${idx + 1}</span>
            </div>
            <div class="log-message-text">${escapeHtml(turn.message)}</div>
          `;
          els.evertalkLogList.appendChild(card);
        });
      }

      // ------------------------------------------------------------------------
      // Chat Message Stream & Rendering
      // ------------------------------------------------------------------------
      function resetChatWithGreeting(persona) {
        state.chatHistory = [];
        els.chatMessageContainer.innerHTML = `
          <div class="chat-session-divider">
            <span>${escapeHtml(persona.name)} 와의 에버톡 세션 시작</span>
          </div>
        `;

        // Send initial greeting if present
        const greeting = persona.personality?.greeting || persona.speech_patterns?.[0];
        if (greeting) {
          appendMessage({
            role: "assistant",
            sender: persona.name,
            content: greeting,
            time: formatTime()
          });
        }
      }

      function appendMessage(msg) {
        state.chatHistory.push(msg);

        const row = document.createElement("div");
        const isUser = msg.role === "user";
        row.className = "message-row " + (isUser ? "user" : "persona");

        const initial = isUser ? "구" : getInitial(msg.sender || state.currentPersonaData?.name);

        row.innerHTML = `
          <div class="message-avatar">${escapeHtml(initial)}</div>
          <div class="message-content-wrap">
            <span class="message-sender-name">${escapeHtml(msg.sender || (isUser ? "구원자" : "페르소나"))}</span>
            <div class="message-bubble-wrapper">
              <div class="message-bubble">${escapeHtml(msg.content)}</div>
              <span class="message-time">${escapeHtml(msg.time || formatTime())}</span>
            </div>
          </div>
        `;

        els.chatMessageContainer.appendChild(row);
        els.chatMessageContainer.scrollTop = els.chatMessageContainer.scrollHeight;
      }

      function setTyping(isTyping) {
        state.isTyping = isTyping;
        els.typingIndicator.style.display = isTyping ? "flex" : "none";
        if (isTyping) {
          els.chatMessageContainer.scrollTop = els.chatMessageContainer.scrollHeight;
        }
      }

      async function handleSendMessage(text) {
        const cleaned = text.trim();
        if (!cleaned || state.isTyping) return;

        // Append User Message
        appendMessage({
          role: "user",
          sender: "구원자",
          content: cleaned,
          time: formatTime()
        });

        els.chatInputText.value = "";
        els.chatInputText.style.height = "24px";
        setTyping(true);

        try {
          const res = await sendChatApi(state.selectedPersonaId, cleaned);
          setTyping(false);
          appendMessage({
            role: "assistant",
            sender: state.currentPersonaData?.name,
            content: res.reply,
            time: formatTime()
          });
        } catch (err) {
          setTyping(false);
          appendMessage({
            role: "assistant",
            sender: "시스템",
            content: `[응답 생성 실패] ${err.message}`,
            time: formatTime()
          });
        }
      }

      // ------------------------------------------------------------------------
      // Evertalk Full Playback / Replay Simulator
      // ------------------------------------------------------------------------
      function playEvertalkLogs(turns) {
        if (!turns || turns.length === 0) return;

        if (state.playbackTimer) {
          clearInterval(state.playbackTimer);
          state.playbackTimer = null;
        }

        state.chatHistory = [];
        els.chatMessageContainer.innerHTML = `
          <div class="chat-session-divider">
            <span>원본 에버톡 대화 순차 재생 중 (${turns.length}개 턴)</span>
          </div>
        `;

        let currentIdx = 0;
        setTyping(true);

        state.playbackTimer = setInterval(() => {
          if (currentIdx >= turns.length) {
            clearInterval(state.playbackTimer);
            state.playbackTimer = null;
            setTyping(false);
            return;
          }

          const turn = turns[currentIdx];
          const isSavior = ["구원자", "Savior", "savior"].includes(turn.speaker);

          appendMessage({
            role: isSavior ? "user" : "assistant",
            sender: turn.speaker,
            content: turn.message,
            time: formatTime()
          });

          currentIdx++;
          if (currentIdx >= turns.length) {
            setTyping(false);
          }
        }, 650);
      }

      // ------------------------------------------------------------------------
      // Event Listeners & UI Binding
      // ------------------------------------------------------------------------
      function bindEvents() {
        // Search Input
        els.personaSearchInput.addEventListener("input", (e) => {
          state.searchQuery = e.target.value;
          applyPersonaFilters();
        });

        // Race Filter Tabs
        els.raceFilterTabs.addEventListener("click", (e) => {
          const btn = e.target.closest(".filter-tab");
          if (!btn) return;
          els.raceFilterTabs.querySelectorAll(".filter-tab").forEach(t => t.classList.remove("active"));
          btn.classList.add("active");
          state.currentRaceFilter = btn.dataset.race;
          applyPersonaFilters();
        });

        // Chat Form Submit
        els.chatInputForm.addEventListener("submit", (e) => {
          e.preventDefault();
          handleSendMessage(els.chatInputText.value);
        });

        // Chat Input Enter Key Handler
        els.chatInputText.addEventListener("keydown", (e) => {
          if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            handleSendMessage(els.chatInputText.value);
          }
        });

        // Textarea Auto-expand
        els.chatInputText.addEventListener("input", () => {
          els.chatInputText.style.height = "auto";
          els.chatInputText.style.height = Math.min(els.chatInputText.scrollHeight, 120) + "px";
        });

        // Top Action: Load Evertalk
        els.btnLoadEvertalk.addEventListener("click", () => {
          const turns = state.currentPersonaData?.dialogues?.evertalk || [];
          if (turns.length === 0) {
            alert("이 페르소나에는 원본 에버톡 대화 기록이 없습니다.");
            return;
          }
          playEvertalkLogs(turns);
        });

        // Top Action: Clear Chat
        els.btnClearChat.addEventListener("click", () => {
          if (state.playbackTimer) {
            clearInterval(state.playbackTimer);
            state.playbackTimer = null;
          }
          resetChatWithGreeting(state.currentPersonaData);
        });

        // Top Action: Toggle Inspector
        els.btnToggleInspector.addEventListener("click", () => {
          els.inspectorSidebar.classList.toggle("open");
        });

        // Inspector Tabs
        document.querySelectorAll(".inspector-nav-tab").forEach(tab => {
          tab.addEventListener("click", () => {
            document.querySelectorAll(".inspector-nav-tab").forEach(t => t.classList.remove("active"));
            tab.classList.add("active");

            const targetId = tab.dataset.target;
            document.querySelectorAll(".tab-panel").forEach(p => p.style.display = "none");
            const targetPanel = document.getElementById(targetId);
            if (targetPanel) targetPanel.style.display = "block";
          });
        });

        // Inspector Evertalk Playback Button
        els.btnPlayLogsStep.addEventListener("click", () => {
          const turns = state.currentPersonaData?.dialogues?.evertalk || [];
          playEvertalkLogs(turns);
        });
      }

      // ------------------------------------------------------------------------
      // Application Bootstrap
      // ------------------------------------------------------------------------
      async function init() {
        bindEvents();
        await checkServerHealth();
        await fetchPersonas();

        // If garnet_rapture exists in fetched personas, select it; otherwise select first
        const initialId = state.personas.some(p => p.id === "garnet_rapture")
          ? "garnet_rapture"
          : (state.personas[0]?.id || "garnet_rapture");

        selectPersona(initialId);
      }

      init();
    })();
  </script>
</body>
</html>
