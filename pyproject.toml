[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "GarnetRapture_evai"
version = "0.1.0"
description = "EVAI spirit identity training: Korean first, then English and Chinese; one LiquidAI/LFM2.5-230M-Base backbone with independent LoRA adapters"
readme = "ARCHITECTURE.md"
requires-python = ">=3.14"
authors = [
    { email = "master@n9k32.com" }
]
dependencies = [
    "torch",
    "transformers>=5.2.0",
    "datasets",
    "accelerate",
    "trl",
    "safetensors",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "peft",
]

[project.scripts]
garnet-evai = "cli.entrypoint:main"

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "adapter",
    "cli",
    "common",
    "evaluation",
    "export",
    "game_data",
    "inference",
    "inspection",
    "persona",
    "sft_dataset",
    "spirit_dataset",
    "training",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = []

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
exclude = ["**/__pycache__", "models", "artifacts", "tmp-codex"]
pythonVersion = "3.14"
typeCheckingMode = "basic"
